[package]
name = "openssh-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A native Rust workspace for SSH connections, keys, tunnels and file transfers"
license = "MIT"
repository = "https://github.com/jeffersonmello/OpenSSH"
readme = "README.md"
default-run = "openssh-manager"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3.6", features = ["apple-native"] }
portable-pty = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
suppaftp = { version = "6.3", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.15"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
